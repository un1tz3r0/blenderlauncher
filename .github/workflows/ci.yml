name: CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libadwaita-1-dev libgirepository-2.0-dev libgtk-4-dev
      - name: Run tests
        run: |
          uv sync --locked
          uv run pytest

  build-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build Python wheel
        run: uv build --wheel --out-dir dist
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Configure Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        run: |
          bash scripts/build-flatpak.sh
          flatpak_name=BlenderLauncher.flatpak
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flatpak_name="BlenderLauncher-${GITHUB_REF_NAME}.flatpak"
          fi
          mv BlenderLauncher.flatpak "dist/$flatpak_name"
      - uses: actions/upload-artifact@v4
        with:
          name: installable-packages
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installable-packages
          path: dist
      - name: Verify tag matches package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
