app-id: org.blenderlauncher.BlenderLauncher
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: blenderlauncher-gui

finish-args:
  # display access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration (for launching Blender)
  - --device=dri
  # network access (to download builds from blender.org)
  - --share=network
  # filesystem access to Downloads directory
  - --filesystem=xdg-download
  # access to config directory
  - --filesystem=xdg-config/blenderlauncher:create
  # access to the host XDG user-dirs metadata
  - --filesystem=xdg-config/user-dirs.dirs:ro
  # allow launching Blender as a subprocess
  - --talk-name=org.freedesktop.Flatpak

modules:
  # third-party Python dependencies, pinned by uv.lock. build-flatpak.sh exports
  # the lockfile to flatpak-requirements.txt (PyGObject is pruned: the runtime
  # provides it). --ignore-installed stops pip from skipping packages the SDK
  # happens to ship (e.g. lxml) but the Platform runtime does not.
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --ignore-installed --require-hashes
        -r flatpak-requirements.txt
    sources:
      - type: file
        path: flatpak-requirements.txt

  - name: blenderlauncher
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - scripts/install-data.sh /app/share
    sources:
      - type: dir
        path: .
